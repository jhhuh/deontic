framework_verdict: "표의자의 중대한 과실로 인한 착오이므로 취소 불가, 법률행위 유효"
court_holding: "상대방이 표의자의 착오를 알고 이를 이용한 경우에는 중대한 과실이 있더라도 의사표시를 취소할 수 있다."
provisions_framework: ["민법 §109①"]
provisions_court: ["민법 §109①", "민법 §109① 단서"]
reasoning: >-
  프레임워크는 §109① 단서(중대한 과실시 취소 불가)만 적용하여 법률행위가 유효하다고 결론지었으나,
  대법원은 같은 단서 규정이 상대방 보호를 위한 것이므로 상대방이 착오를 알고 이용한 경우에는
  중대한 과실이 있더라도 취소할 수 있다고 판시하여, 양자의 결론이 정반대이다.
