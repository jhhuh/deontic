framework_verdict: "유효 (§126 표현대리 적용으로 번복)"
court_holding: "사실행위에 불과한 업무는 기본대리권이 될 수 없으므로 §126 표현대리가 성립하지 않는다."
provisions_framework: ["§126", "§130"]
provisions_court: ["§126"]
reasoning: "프레임워크는 §126 표현대리가 성립하여 법률행위가 유효하다고 판단하였으나, 대법원은 위임받은 업무(고객 유치, 투자상담 등)가 사실행위에 불과하여 법률행위에 관한 기본대리권이 존재하지 않으므로 §126 표현대리가 성립할 수 없다고 판시하였다. 프레임워크가 기본대리권의 성질(사실행위 vs 법률행위)을 구별하지 못한 것이 오판의 원인이다."
