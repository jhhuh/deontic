match: partial
framework_verdict: "유효 (§108②에 의해 선의의 제3자 보호, §108① 무효 번복)"
court_holding: "통정허위표시의 무효는 선의의 제3자에게 대항할 수 없으므로, 피고들의 선의 여부를 심리하지 않은 원심을 파기환송한다."
provisions_framework:
  - §108①
  - §108②
provisions_court:
  - §108①
  - §108②
reasoning: >
  프레임워크는 §108②의 선의 제3자 보호 법리를 정확히 적용하여 법률행위를 유효로 판단하였고,
  이는 대법원이 설시한 법리(선의의 제3자에 대해서는 허위표시도 표시된 대로 효력이 있다)와 일치한다.
  다만 대법원은 피고들이 실제로 선의인지 여부에 대한 사실심리가 필요하다고 보아 파기환송한 반면,
  프레임워크는 선의를 전제로 곧바로 유효라고 결론내려 사실인정 단계의 조건부 판단이 누락되어 있다.
